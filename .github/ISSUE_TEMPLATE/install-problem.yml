name: 설치 문제
description: 설치하거나 실행할 때 문제가 있어요.
title: "[설치] "
labels: ["설치"]
body:
  - type: markdown
    attributes:
      value: |
        이 서버는 검사할 때 인터넷이 필요 없습니다. 설치할 때만 필요합니다.
        먼저 [설치 가이드](../blob/main/docs/install/)를 한 번 봐 주세요.
  - type: dropdown
    id: client
    attributes:
      label: 어디에 설치하나요?
      options:
        - Claude Desktop
        - Claude Code
        - 기타
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 운영체제
      placeholder: Windows 11 / macOS 14 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 버전
      description: 터미널에 node -v 를 치면 나옵니다. (22 이상이 필요합니다)
      placeholder: v22.x
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요?
      description: 어떤 단계에서 무엇이 안 됐는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그 (있으면)
      description: 오류 메시지가 있으면 붙여넣어 주세요.
      render: shell
